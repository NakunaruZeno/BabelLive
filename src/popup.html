<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabelLive</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="popup-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="3" width="16" height="14" rx="3.5" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 11.5h3.5M11 11.5h3.5M5.5 14h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </div>
        <div class="brand-copy">
          <span class="brand-name">BabelLive</span>
          <span class="live-pill" id="livePill" data-state="idle">
            <span class="live-pill-dot"></span>
            <span id="livePillText">IDLE</span>
          </span>
        </div>
      </div>

      <label class="switch switch-lg" for="masterToggle" title="Toggle live subtitles">
        <input type="checkbox" id="masterToggle" aria-label="Toggle live subtitles">
        <span class="switch-track"></span>
      </label>
    </header>

    <!-- Contextual Status Bar -->
    <div class="telemetry-bar" id="statusBar" role="status" aria-live="polite">
      <span class="status-dot idle" id="statusDot"></span>
      <span class="status-text" id="statusText">Ready — toggle switch to start</span>
    </div>

    <div class="content-stack">
      <!-- Language Pair -->
      <section class="panel" aria-labelledby="label-lang">
        <div class="panel-header">
          <span class="panel-title" id="label-lang">Translation Pair</span>
        </div>
        <div class="lang-bar">
          <div class="lang-field">
            <label class="field-caption" for="sourceLang">From</label>
            <select class="select-control" id="sourceLang">
              <option value="auto">Auto-detect</option>
              <option value="ja" selected>Japanese</option>
              <option value="en">English</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="es">Spanish</option>
              <option value="ru">Russian</option>
              <option value="th">Thai</option>
            </select>
          </div>

          <button type="button" class="icon-btn swap-btn" id="swapLangs" title="Swap languages" aria-label="Swap source and target languages">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
              <path d="M3.5 5.5h9M10 3l2.5 2.5L10 8M12.5 10.5h-9M6 13l-2.5-2.5L6 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>

          <div class="lang-field">
            <label class="field-caption" for="targetLang">To</label>
            <select class="select-control" id="targetLang">
              <option value="vi" selected>Vietnamese</option>
              <option value="en">English</option>
              <option value="ja">Japanese</option>
              <option value="zh">Chinese</option>
              <option value="ko">Korean</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="es">Spanish</option>
              <option value="ru">Russian</option>
              <option value="th">Thai</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Appearance & Typography -->
      <section class="panel" aria-labelledby="label-style">
        <div class="panel-header">
          <span class="panel-title" id="label-style">Subtitle Appearance</span>
        </div>

        <div class="segmented-presets" role="radiogroup" aria-label="Subtitle preset">
          <button type="button" class="preset-btn active" data-preset="anime" id="presetAnime">
            <span class="preset-sample sample-anime">あ</span>
            <span class="preset-label">Anime</span>
          </button>
          <button type="button" class="preset-btn" data-preset="cinema" id="presetCinema">
            <span class="preset-sample sample-cinema">CC</span>
            <span class="preset-label">Cinema</span>
          </button>
          <button type="button" class="preset-btn" data-preset="minimal" id="presetMinimal">
            <span class="preset-sample sample-minimal">Aa</span>
            <span class="preset-label">Minimal</span>
          </button>
        </div>

        <div class="control-row slider-block">
          <div class="slider-meta">
            <label class="row-label" for="fontSizeSlider">Caption Scale</label>
            <span class="mono-value" id="fontSizeValue">22px</span>
          </div>
          <input type="range" class="range-slider" id="fontSizeSlider" min="14" max="36" value="22" step="1">
        </div>

        <div class="divider"></div>

        <div class="control-row">
          <label class="row-label" for="bilingualToggle">Bilingual Display <span class="row-sub">Original + translated</span></label>
          <label class="switch" for="bilingualToggle">
            <input type="checkbox" id="bilingualToggle" checked>
            <span class="switch-track"></span>
          </label>
        </div>

        <div class="control-row">
          <label class="row-label" for="demoToggle">Preview Overlay <span class="row-sub">Sample captions</span></label>
          <label class="switch" for="demoToggle">
            <input type="checkbox" id="demoToggle">
            <span class="switch-track"></span>
          </label>
        </div>
      </section>

      <!-- Backend Stream Endpoint -->
      <section class="panel" aria-labelledby="label-backend">
        <div class="panel-header">
          <span class="panel-title" id="label-backend">Inference Endpoint</span>
          <div class="colab-status" id="colabStatus">
            <span class="status-dot idle"></span>
            <span id="colabStatusText">Disconnected</span>
          </div>
        </div>

        <div class="input-group">
          <label class="field-caption" for="colabUrl">WebSocket URL (Modal or Colab)</label>
          <div class="endpoint-row">
            <input type="url" class="mono-input" id="colabUrl"
                   placeholder="wss://your-endpoint.modal.run/ws/live"
                   spellcheck="false" autocomplete="off">
            <button type="button" class="icon-btn test-btn" id="testColabBtn" title="Verify WebSocket connection" aria-label="Verify WebSocket connection">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M13.5 4.5L6.5 11.5L2.5 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </div>

        <details class="colab-drawer" id="colabDrawer">
          <summary class="drawer-trigger">
            <span>Google Colab Auto-Launcher</span>
            <svg class="drawer-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </summary>
          <div class="drawer-body">
            <label class="field-caption" for="colabNotebookUrl">Colab Drive Notebook Link</label>
            <input type="url" class="mono-input" id="colabNotebookUrl"
                   placeholder="https://colab.research.google.com/drive/..."
                   spellcheck="false" autocomplete="off">
          </div>
        </details>

        <button type="button" class="primary-btn" id="oneClickStartBtn">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M5 3.5l7.5 4.5-7.5 4.5V3.5z" fill="currentColor" />
          </svg>
          <span id="oneClickBtnText">Connect &amp; Start Subtitles</span>
        </button>
      </section>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="footer-brand">BabelLive Studio</span>
      <span class="footer-version">v1.1.0</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>

</html>
